<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cute Bloody Stream</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #0b0b10; overflow: hidden; }
      #game { width: 100vw; height: 100vh; }
      /* DOM-оверлей: чат и карточки донатов (ТЗ, раздел 2). */
      .chat {
        box-sizing: border-box; display: flex; flex-direction: column;
        background: rgba(12, 10, 20, 0.72); border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 14px; font: 18px/1.35 "Segoe UI", Roboto, Arial, sans-serif; color: #e8e6f0;
        pointer-events: none; overflow: hidden;
      }
      .chat-head {
        padding: 10px 14px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; font-size: 15px;
        background: rgba(255, 255, 255, 0.06); border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        display: flex; align-items: center; gap: 8px;
      }
      .live-dot { width: 10px; height: 10px; border-radius: 50%; background: #ff2a4a; box-shadow: 0 0 8px #ff2a4a; }
      /* Список прокручивается колесом мыши; прижат к низу через margin-top: auto у первого сообщения.
         min-height: 0 обязателен: без него flex-элемент растягивается под содержимое и не прокручивается. */
      .chat-list {
        flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 8px 12px; display: flex; flex-direction: column;
        pointer-events: auto; scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, 0.25) transparent;
      }
      .chat-list > :first-child { margin-top: auto; }
      .chat-msg { padding: 3px 0; word-wrap: break-word; animation: chatIn .18s ease-out; }
      .chat-msg.hl { background: rgba(255, 60, 110, 0.18); border-radius: 6px; padding: 4px 6px; margin: 2px -6px; }
      .chat-msg .nick { font-weight: 700; }
      @keyframes chatIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      .donation {
        box-sizing: border-box; width: 640px; padding: 28px 34px; border-radius: 20px;
        background: linear-gradient(160deg, rgba(255, 70, 130, 0.95), rgba(120, 30, 90, 0.95));
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 0 3px rgba(255, 255, 255, 0.15) inset;
        font: 22px/1.4 "Segoe UI", Roboto, Arial, sans-serif; color: #fff; text-align: center; pointer-events: none;
      }
      .donation .d-head { font-size: 18px; opacity: .85; text-transform: uppercase; letter-spacing: .08em; }
      .donation .d-nick { font-size: 30px; font-weight: 800; margin-top: 6px; }
      .donation .d-amount { font-size: 44px; font-weight: 900; color: #ffe066; text-shadow: 0 3px 0 rgba(0,0,0,.25); }
      .donation .d-text { font-size: 28px; font-weight: 700; margin-top: 10px; }
      .donation .d-hint { font-size: 18px; opacity: .8; margin-top: 18px; }
      /* Настройки: значок в правом верхнем углу (над шапкой чата) и модальное окно громкости. */
      .settings-root { position: absolute; inset: 0; z-index: 1000000; pointer-events: none;
        font: 22px/1.35 "Segoe UI", Roboto, Arial, sans-serif; color: #e8e6f0; }
      .settings-gear {
        position: absolute; top: 22px; right: 22px; width: 41px; height: 41px; padding: 0; display: grid; place-items: center;
        pointer-events: auto; cursor: pointer; color: #e8e6f0;
        background: rgba(12, 10, 20, 0.72); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 10px;
        transition: color .15s, background .15s, transform .25s;
      }
      .settings-gear:hover { color: #fff; background: rgba(255, 61, 127, 0.55); transform: rotate(40deg); }
      .settings-gear:focus-visible { outline: 2px solid #ff3d7f; outline-offset: 2px; }
      .settings-backdrop { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: auto;
        background: rgba(0, 0, 0, 0.55); }
      .settings-backdrop[hidden] { display: none; }
      .settings-panel {
        box-sizing: border-box; width: 640px; padding: 34px 40px 36px; border-radius: 20px;
        background: rgba(22, 18, 34, 0.96); border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      }
      .settings-title { font-size: 40px; font-weight: 800; color: #fff; margin-bottom: 26px; }
      .settings-row { display: grid; grid-template-columns: 210px 1fr 70px; align-items: center; gap: 18px; margin: 18px 0; cursor: pointer; }
      .settings-label { font-weight: 700; display: flex; flex-direction: column; }
      .settings-note { font-size: 15px; font-weight: 400; color: #9d97b3; }
      .settings-note[hidden] { display: none; }
      .settings-value { text-align: right; font-variant-numeric: tabular-nums; color: #ffb3cf; font-weight: 700; }
      .settings-row input[type=range] {
        -webkit-appearance: none; appearance: none; width: 100%; height: 10px; border-radius: 5px; margin: 0; cursor: pointer;
        background: linear-gradient(to right, #ff3d7f var(--fill, 50%), rgba(255, 255, 255, 0.16) var(--fill, 50%));
      }
      .settings-row input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none; width: 26px; height: 26px; border-radius: 50%; background: #fff; border: 3px solid #ff3d7f;
      }
      .settings-row input[type=range]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: #fff; border: 3px solid #ff3d7f; }
      .settings-row input[type=range]:focus-visible { outline: 2px solid #ff3d7f; outline-offset: 6px; }
      .settings-done {
        display: block; margin: 30px auto 0; min-width: 240px; padding: 14px 28px; border: 0; border-radius: 14px; cursor: pointer;
        font: 700 24px "Segoe UI", Roboto, Arial, sans-serif; color: #fff; background: #ff3d7f;
      }
      .settings-done:hover { background: #ff5a93; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
